schema: spec-driven

context: |
  org2md is a Go CLI that converts an Emacs org-mode file into Markdown for an
  Obsidian vault. Go 1.27, gofmt formatting, idiomatic error handling.

  Planning: OpenSpec is the planning system for all new work. `docs/design.md` is
  the frozen v1 design record — its FR-1 … FR-7 numbering and org → Markdown
  mapping tables remain the reference for existing behavior, and its "Open
  questions" section is the backlog new changes are drawn from, but no new plan
  steps are added to it. Update it only when a change settles one of those
  questions or contradicts a documented decision.

  Git: never commit to `main`. Every task in a change's `tasks.md` gets its own
  branch and its own pull request, with a branch prefix matching the
  conventional-commit type (`feat/`, `fix/`, `refactor/`, `test/`, `docs/`,
  `chore/`). Never implement two tasks on one branch, and never reopen a merged
  task's branch to carry the next one. `main` must build and pass its tests at
  every merge, so a task is sized to be independently shippable. Do not commit
  unless asked, and never pass `--no-verify`.

  Test-driven, without exception: the failing test is written first and watched
  fail, then the minimum code to pass it, then refactor. No production code lands
  without a test that drove it. A bug is reproduced as a failing test before the
  fix is touched. Because each task is its own pull request, the whole
  red-green-refactor cycle happens inside one task — the test and the code that
  satisfies it land together, never split across two pull requests.

  `make` is the interface for building and testing — use the Makefile targets
  (`build`, `test`, `test-race`, `cover`, `vet`, `fmt`, `clean`, `install`)
  rather than calling `go` directly. A single `go test -run TestName ./pkg` during
  a red-green cycle is fine. If a target is missing, add it to the Makefile
  instead of working around it. `make golden` rewrites the golden files in
  `internal/md/testdata` and `cmd/org2md/testdata`; it builds the binary, and
  `go test -short` skips the end-to-end tests that need one.

  Architectural constraints a change must not break:
  - Conversion is pure: `io.Reader` in, string out. `internal/org` and
    `internal/md` touch neither the filesystem nor the environment. Anything
    interactive or environment-dependent belongs in `internal/vault` or `main`.
  - Parsing is line-oriented in two phases (blocks, then inlines). Inline markup
    is never applied inside source/example/verbatim content — a bare `*` in a
    shell snippet has to survive.
  - `internal/org` owns org syntax; `internal/md` owns Obsidian conventions. A
    construct with no Markdown equivalent is a rendering decision, not a parsing
    one.
  - Unrecognized org syntax passes through verbatim with a warning; it never
    fails the run.
  - `Render` returns `(string, []string)` — the Markdown and the warnings, in
    document order. Anything org can say that Markdown cannot is reported rather
    than dropped in silence, with `:LOGBOOK:` the one deliberate exception.
  - Output placement: explicit `-o` wins; otherwise write beside the source and
    offer the `$MDNOTES_INBOX` move. That variable names the destination
    directory itself, must already exist, and is checked before anything is
    written. The target vault does not use daily notes, so dates never render as
    links.

  Tests are table-driven snippets per construct plus `testdata/` golden files for
  whole documents. `internal/vault` tests use `t.TempDir()` and take the inbox as
  a `Placer` field rather than from the environment, with the prompt reading from
  an injected `io.Reader`, so no test needs a TTY. `cmd/org2md`, which does read
  the environment, unsets the inbox variables in `TestMain`: a developer's own
  shell has one exported, and a test must never reach a real vault.

rules:
  proposal:
    - State explicitly what is out of scope.
    - Cite the FR number from docs/design.md that the change extends, or the
      numbered open question it answers, when one applies.
  specs:
    - Write requirements as observable org input → Markdown output behavior, not
      as parser or renderer internals.
    - Give a scenario for the warning path whenever the behavior can warn, and for
      content that must survive untransformed whenever the change touches inline
      markup.
  design:
    - Name which package owns each part of the change (cmd/org2md, internal/org,
      internal/md, internal/vault) and say how the purity boundary is preserved.
    - Call out any change to the org → Markdown mapping tables in docs/design.md.
  tasks:
    - Keep tasks independently shippable — each one must be mergeable into a
      green `main` on its own, because each one becomes its own branch and pull
      request.
    - Name the failing test that drives each task, and the package it lives in, so
      the red step is unambiguous before any production code is written.
    - Reject any task that would land production code with no test driving it.
      Split it into a task that can be driven by a test, or state in the task why
      no behavior changed.
    - Give each task its branch name, prefixed with the conventional-commit type
      the work carries.
    - Carry the whole red-green-refactor cycle inside a single task. Never split
      the failing test and the code that satisfies it across two tasks.
    - Include a `make golden` step, with a read of the resulting diff, in any task
      whose rendering output changes.

operations:
  apply:
    guidance:
      - Work one task at a time. Before touching anything, cut that task's branch
        from an up-to-date `main`, using the branch name the task names.
      - Write that task's failing test first and run it. Report that it failed,
        and what it failed with, before writing a line of production code.
      - Then write the minimum code that makes it pass, run the test again, and
        only then refactor.
      - Run `make check` (vet, then test) before marking a task complete, and
        `make test-race` when the task touches concurrency.
      - For a rendering change, run `make golden` and read the diff before
        committing it.
      - Finish a task with its own pull request, then return to `main` for the
        next task. Never carry a second task onto a branch that already holds one,
        and never let a task land without the test that drove it.
      - If a task turns out to need production code that no test can drive, stop
        and say so rather than writing it. That is a sign the task or the spec is
        wrong.
  archive:
    guidance:
      - Say which docs/design.md open question the change resolved, if any, and
        update that section rather than leaving the code to drift from the spec.
